[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveflowdb_client" 
version = "1.0.6"
description = "VectorLake SDK — Deterministic backend engine powering agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
  { name = "agentanalytics.ai", email = "nitin@agentanalytics.ai" }
]

keywords = ["vector db", "VECTOR QUERY LANGUAGE", "waveflowdb", "agentanalytics", "VQL"]

dependencies = [
    "requests",
    "numpy",
    "tqdm",
    "python-dotenv",
]

[project.optional-dependencies]
documents = [
    "PyPDF2",
    "python-docx",
    "pdfspine",
    "pytesseract",
]

cloud-ocr = [
    "boto3",
    "google-cloud-vision",
    "azure-ai-documentintelligence",
]

[project.urls]
Homepage = "https://agentanalytics.ai"
Documentation = "https://www.agentanalytics.ai/docs/waveflow-db"

[tool.setuptools.packages.find]
include = ["waveflowdb_client*"]