name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine pytest
          pip install -e .

      - name: Tests
        run: pytest tests/ || [ $? -eq 5 ]   # exit code 5 = no tests collected

      - name: Build and check metadata
        run: |
          python -m build
          twine check --strict dist/*